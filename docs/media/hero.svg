@keyframes js0{0%{opacity:0}0%{opacity:0}1.7%{opacity:1}63.3%{opacity:1}65%{opacity:0}100%{opacity:0}}
@keyframes js1{0%{opacity:0}63.3%{opacity:0}65%{opacity:1}98.3%{opacity:1}100%{opacity:0}100%{opacity:0}}
